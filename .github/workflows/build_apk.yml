name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd mobile_flutter
          flutter pub get

      - name: Build APK (Release & Debug)
        run: |
          cd mobile_flutter
          flutter build apk --release
          flutter build apk --debug

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: btech-learning-platform-release-apk
          path: mobile_flutter/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: btech-learning-platform-debug-apk
          path: mobile_flutter/build/app/outputs/flutter-apk/app-debug.apk
